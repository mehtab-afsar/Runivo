// L4: the Runivo Wear OS app. Included in the Android build only when
// RUNIVO_WEAR=1 (plugins/withWearCompanion.js). Publish it as a separate
// Wear OS APK with the same applicationId as the phone app.
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
  namespace 'app.runivo.wear'
  compileSdk 36
  defaultConfig {
    applicationId rootProject.ext.has('wearApplicationId') ? rootProject.ext.wearApplicationId : 'com.mehtabafsar.runivo'
    minSdk 30
    targetSdk 34
    versionCode 1
    versionName '1.0.0'
  }
  buildFeatures { compose true }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }
}

dependencies {
  implementation 'com.google.android.gms:play-services-wearable:18.2.0'
  implementation 'androidx.activity:activity-compose:1.9.3'
  implementation platform('androidx.compose:compose-bom:2024.10.01')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.wear.compose:compose-material:1.4.0'
  implementation 'androidx.wear.compose:compose-foundation:1.4.0'
}
