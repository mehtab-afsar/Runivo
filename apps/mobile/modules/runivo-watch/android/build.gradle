plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.runivo'
version = '1.0.0'

android {
  namespace "expo.modules.runivowatch"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Wear OS Data Layer: messages between the phone and the Runivo watch app (L4).
  implementation 'com.google.android.gms:play-services-wearable:18.2.0'
}
