name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Typecheck, lint, unit tests: the original job, plus the checks that kept drifting.
  js:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Typecheck (web, mobile, shared)
        run: npm run typecheck

      # Fails on errors only. ~90 warnings are tolerated today (no-explicit-any,
      # exhaustive-deps, cross-feature imports); burn them down, then add --max-warnings.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # supabase/functions/_shared/runEngine.ts is a byte copy of the shared engine.
      - name: Engine copy is in sync
        run: |
          npm run engine:sync
          git diff --exit-code -- supabase/functions/_shared/runEngine.ts

      - name: Migration lint
        run: node scripts/lint-migrations.mjs

      # Advisory until the known transitive findings are cleared; then drop `|| true`.
      - name: Dependency audit (production, high and above)
        run: npm audit --omit=dev --audit-level=high || true

  # Type-checks the edge functions (they are Deno, which tsc cannot see) and runs the
  # helper tests that use Deno APIs.
  deno:
    name: Edge functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check
        run: |
          for f in supabase/functions/*/index.ts; do
            echo "deno check $f"
            deno check "$f"
          done

  # Applies every migration to a real local Supabase and runs supabase/tests.
  # First run on a runner may expose tests that assumed a hand-built database; keep
  # it non-blocking until it has passed once, then remove continue-on-error.
  sql:
    name: Database tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (applies all migrations)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,realtime,storage-api
      # Includes function_privileges.test.sql, which fails if a server-only function
      # becomes callable by clients.
      - name: Tests
        run: scripts/run-sql-tests.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  # Scans the commits in a pull request. History before this was added is not rescanned
  # (an old service key lives there; it is handled by rotating it, not by this check).
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
